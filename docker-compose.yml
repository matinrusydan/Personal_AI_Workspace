# Personal AI Workspace — Local Services Docker Compose
# Architecture: ADR-002 (PostgreSQL Authoritative), ADR-003 (Redis / BullMQ), ADR-010 (Docker Compose)
# Security: Binds strictly to 127.0.0.1 (No public network exposure per docs/SECURITY.md)

services:
  postgres:
    image: postgres:16-alpine
    container_name: paw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-paw_dev}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-paw_dev}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - paw-network

  redis:
    image: redis:7-alpine
    container_name: paw-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - paw-network

volumes:
  postgres_data:
    name: paw_postgres_data
  redis_data:
    name: paw_redis_data

networks:
  paw-network:
    name: paw_network
    driver: bridge
